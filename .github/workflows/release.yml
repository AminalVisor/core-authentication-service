name: Release check

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bunx vitest run

      - name: Build library
        run: bun run build:lib

      - name: Verify dist/ matches the committed build
        run: |
          if ! git diff --quiet -- dist/; then
            echo "::error::Committed dist/ is stale. Merge the latest main (the build workflow keeps it fresh) before tagging."
            exit 1
          fi
          echo "dist/ is fresh — release is good to consume."
